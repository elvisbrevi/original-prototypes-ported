<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{{TITULO}}</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            position: absolute;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- mq_js_bundle.js de macroquad 0.4.16; tiene que coincidir con la versión del crate. -->
    <script src="mq_js_bundle.js"></script>
    <script>
        // crates/museo (tactil.rs) pregunta si el puntero principal es táctil (móvil o tablet)
        // y avisa de si muestra los controles táctiles (lo lee tools/humo-web).
        window.museo = { tactilVisible: null, beta: 0 };
        // Inclinación del dispositivo (DeviceOrientationEvent.beta), para los juegos que la usan.
        // En iOS hay que pedir permiso después de un toque.
        window.addEventListener("deviceorientation", function (e) {
            window.museo.beta = e.beta || 0;
        });
        document.addEventListener("touchend", function pedir() {
            document.removeEventListener("touchend", pedir);
            if (typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function") {
                DeviceOrientationEvent.requestPermission().catch(function () {});
            }
        });
        miniquad_add_plugin({
            name: "museo_tactil",
            version: 1,
            register_plugin: function (importObject) {
                importObject.env.museo_es_tactil = function () {
                    return window.matchMedia("(pointer: coarse)").matches ? 1 : 0;
                };
                importObject.env.museo_tactil_visible = function (visible) {
                    window.museo.tactilVisible = visible !== 0;
                };
                // miniquad 0.4 no trae glDepthMask (crates/unity lo usa para probar la
                // profundidad sin escribirla en los objetos transparentes).
                importObject.env.glDepthMask = function (flag) {
                    gl.depthMask(flag !== 0);
                };
                importObject.env.museo_beta = function () {
                    return window.museo.beta;
                };
                // crates/museo (preferencias.rs): enteros guardados por juego en localStorage.
                importObject.env.museo_pref_leer = function (clave, defecto) {
                    try {
                        var v = window.localStorage.getItem("museo:" + document.title + ":" + clave);
                        return v === null ? defecto : (parseInt(v, 10) | 0);
                    } catch (e) {
                        return defecto;
                    }
                };
                importObject.env.museo_pref_guardar = function (clave, valor) {
                    try {
                        window.localStorage.setItem("museo:" + document.title + ":" + clave, String(valor));
                    } catch (e) {}
                };
            },
        });
        load("{{WASM}}");
        document.getElementById("glcanvas").focus();
    </script>
</body>
</html>
